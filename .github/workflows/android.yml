name: APK bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk TeamBoard-NEU-WebView.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TeamBoard-NEU-WebView-APK
          path: TeamBoard-NEU-WebView.apk
      - name: Release mit direkter APK-Datei
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neu --yes --cleanup-tag || true
          gh release create neu TeamBoard-NEU-WebView.apk --title "Team-Board APK (neu)" --notes "Direkter Download: TeamBoard-NEU-WebView.apk"
