name: APK bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk TeamBoard-NEU-WebView.apk
      - name: Versionsdatei fuer Auto-Update
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHA=$(sha256sum TeamBoard-NEU-WebView.apk | cut -d' ' -f1)
          echo "{\"code\":$CODE,\"name\":\"$NAME\",\"sha256\":\"$SHA\"}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: TeamBoard-NEU-WebView-APK
          path: TeamBoard-NEU-WebView.apk
      - name: Release mit direkter APK-Datei
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neu --yes --cleanup-tag || true
          gh release create neu TeamBoard-NEU-WebView.apk version.json --title "Team-Board APK (neu)" --notes "Direkter Download: TeamBoard-NEU-WebView.apk"
